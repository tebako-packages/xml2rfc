  release: "v2.6.0"          # v2.6.0 is the first release whose embedded
                             # root public key verifies the registry's
                             # signature pins at the publish's own
                             # clean-cache verify (the metanorma pattern);
                             # it also ships spec 32 (the kind: executable
                             # spawn edge — this payload is its first
                             # instance) and the spec-26 `tebako check`
                             # engine this feedstock's press-time gate rides
