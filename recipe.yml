# Feedstock recipe for xml2rfc
# spec 13 §9 + docs/conventions.md in tebako-packages/index
name: "xml2rfc"
kind: app
summary: "xml2rfc — the IETF RFC/XML authoring renderer (python app; runtime-required payload)"

upstream:
  # PyPI closure, not a tarball: the dependency set is resolved from PyPI
  # by tools/build (the pip analog of the metanorma feedstock's rubygems
  # closure rule) and every wheel/sdist is sha256-verified before use.
  # The locked closure with hashes is generated, never hand-authored:
  # closure/<version>-<triplet>.txt (metanorma pattern).
  pypi: "xml2rfc"
  version: "3.34.0"          # PyPI-verified latest, 2026-09-05
  source: "https://pypi.org"
  # requires_python >= 3.10 (PyPI-verified 2026-09-05); upstream tests
  # through 3.13. The MANIFEST's runtime edge is the ABI line (~> 3.13.0),
  # not this range — the payload carries lxml/markupsafe C extensions, so
  # spec 05 §5's native-extension law applies: wrong line = named error,
  # never a segfault. This range documents the pure-language floor only.

build:
  system: pipstage         # stage a pip --target closure with a tebako runtime's own python
  runtime:
    engine: python
    version: "3.13.15"     # the staging + exec runtime (tebako-runtime-python tidy line)
    tebako: "0.1.3"        # the runtime package's <ver> (the factory's
                           # VERSION — the real line opened at 0.1.0,
                           # owner GO 2026-09-05; 0.0.0 was the
                           # never-published placeholder). 0.1.3 is the
                           # first SIGNED line (the spec 09 §9 re-cut) —
                           # the REQUIRE_SIGNED=1 closure needs it.
    # RELEASE CHANNEL (the owner's publish decision landed 2026-09-06:
    # tebako-runtime-python v0.1.0 is live). The staging runtime and the
    # CI test legs resolve the factory RELEASE — tools/stage_runtime's
    # release channel downloads the pinned tag's assets (sha256-verified
    # three ways: per-asset .sha256 sidecar ↔ SHA256SUMS.txt ↔ the
    # manifest.json entry) into a file:// runtime mirror (spec 05 §2's
    # download-base shape; tebako resolves runtimes by
    # TEBAKO_RUNTIME_MIRROR + the config.yaml `runtimes:` pin — spec 04
    # §2's kind:runtime registry entries remain PLANNED, TODO.v2-1/30).
    # NEVER a hand-installed python. The run-artifacts channel remains
    # selectable by env override for pre-publish factory builds only.
    channel: release       # release (published factory tag) | run-artifacts (pre-publish proof builds)
    release: "v0.1.3"      # the factory release tag (release channel)
  # The closure's native members (lxml — C extension, per-triplet wheels,
  # musl = musllinux; markupsafe / pyyaml optional C speedups): staged
  # from PyPI wheels matching the staging runtime's ABI tag (cp313) and
  # the leg's triplet — the wheel-tag ↔ ABI-line/triplet mapping of
  # TODO.python/04 item 1. Source builds of native members are NEVER a
  # feedstock path (no compilation machinery for audiences 1-3).
  native_members: ["lxml", "markupsafe", "pyyaml"]

platforms:
  # the tebako-runtime-python 02 matrix's POSIX legs (windows is
  # TODO.python/05's descoped row — this feedstock gains the
  # x86_64-windows-ucrt leg with 05, and the metanorma DEPENDS edge
  # keeps windows on its current path until then)
  - x86_64-linux-gnu
  - aarch64-linux-gnu
  - x86_64-linux-musl
  - aarch64-linux-musl
  - x86_64-macos
  - aarch64-macos

provides:
  entrypoints:
    - {name: "xml2rfc", path: "/bin/xml2rfc", version: "3.34.0"}
  executables: []          # no host-tier executables: the console script
                           # needs the interpreter (spec 32's spawn form)

ci:
  # The leg topology (host runner per triplet): the tebako-runtime-python
  # factory's POSIX matrix minus windows (TODO.python/05). The linux legs
  # run on the ubuntu host and docker-run the pinned tpkg-builder image
  # per triplet-matched step — the musl image is alpine-based and node
  # actions cannot run on musl (the factory's _build-platform.yml grammar).
  hosts:
    x86_64-linux-gnu: "ubuntu-22.04"
    aarch64-linux-gnu: "ubuntu-22.04-arm"
    x86_64-linux-musl: "ubuntu-22.04"
    aarch64-linux-musl: "ubuntu-22.04-arm"
    x86_64-macos: "macos-15-intel"
    aarch64-macos: "macos-14"
  # Pinned BY DIGEST (tebako-ci-containers README: consumers pin by
  # digest; the v1 tag is the baked alpine 3.21 provisioning). Only the
  # musl legs docker-run — the gnu runtime exe executes on the ubuntu
  # host's own glibc (no compilation anywhere in this feedstock).
  containers:
    x86_64-linux-musl: "ghcr.io/tamatebako/tpkg-builder-x86_64-linux-musl@sha256:415db3a92771404d13e8c6276327d0df978a8bacccaee24c056e1f7890d9aae8"
    aarch64-linux-musl: "ghcr.io/tamatebako/tpkg-builder-aarch64-linux-musl@sha256:0e6711a7ad7668875df752bc07ef9097fc026797bc93da8de0d704810a1be137"

