# Signing (spec 09 §9; the metanorma/hello pattern): the tamatebako CI
# signing subkey signs every payload asset + the registry entry carries
# the signature pin. The publisher IS the tools block's pinned tebako
# CLI. The secret key arrives as org secret TEBAKO_CI_SIGNING_KEY,
# staged by the publish step into the publisher home's keys/.
signing:
  keyid: "efc3c250f7862a48" # 2026-09-09 tamatebako root primary (low 64)

schema_version: 1
